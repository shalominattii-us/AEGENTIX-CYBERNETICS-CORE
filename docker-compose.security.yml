services:
  aegentix-core:
    image: aegentix/core:latest
    container_name: aegentix-core-hardened
    read_only: true
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=32m
    networks:
      - aegentix-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  aegentix-agent-monitoring:
    image: aegentix/monitoring-agent:latest
    container_name: aegentix-agent-monitoring-hardened
    read_only: true
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    environment:
      - NODE_ENV=production
      - CISA_FEED_SYNC_INTERVAL=3600
      - LOG_LEVEL=info
    networks:
      - aegentix-internal
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  aegentix-telemetry-engine:
    image: python:3.11-slim
    container_name: aegentix-telemetry-engine
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./security/agent_security_engine.py:/app/agent_security_engine.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    working_dir: /app
    command: python agent_security_engine.py
    environment:
      - PYTHONUNBUFFERED=1
      - NODE_ENV=production
    networks:
      - aegentix-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  aegentix-falco-monitor:
    image: falcosecurity/falco:latest
    container_name: aegentix-falco-monitor
    privileged: true
    security_opt:
      - apparmor=unconfined
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/dev
      - /proc:/proc:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - ./security/falco-aegentix-rules.yaml:/etc/falco/falco-aegentix-rules.yaml:ro
    environment:
      - FALCO_K8S_AUDIT_ENDPOINT=
    command: >
      falco
      --cri /run/containerd/containerd.sock
      --cri /run/cri-o/cri-o.sock
      -o json_output=true
      -o file_output.enabled=true
      -o file_output.filename=/tmp/falco.log
      -r /etc/falco/falco-aegentix-rules.yaml
    networks:
      - aegentix-internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  aegentix-internal:
    driver: bridge
    internal: false
