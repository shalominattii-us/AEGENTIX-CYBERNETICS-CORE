[project]
name = "aegentix-cyberdaw"
version = "0.1.0"
description = "AEGENTIX CyberDAW production gate and integration contracts"
requires-python = ">=3.10"

[project.scripts]
cyberdaw = "cyberdaw.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests/cyberdaw"]
# Put the repo root on sys.path so `import cyberdaw` resolves without an
# editable install. CI runs bare `pytest` from the root, where the package
# is not on the path by default.
pythonpath = ["."]
