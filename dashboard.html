<!DOCTYPE html>
<html>
<head>
    <title>AEGENTIX Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #00ff88; font-family: 'Courier New', monospace; padding: 20px; }
        .header { border-bottom: 1px solid #00ff88; padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { color: #00ff88; font-size: 28px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .card { background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 20px; text-align: center; }
        .card .label { color: #666; font-size: 12px; text-transform: uppercase; }
        .card .value { color: #00ff88; font-size: 24px; font-weight: bold; margin: 10px 0; }
        .online { color: #00ff88; }
        .offline { color: #ff4444; }
        .key-status { background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 20px; margin-top: 20px; }
        .key-status .valid { color: #00ff88; }
        .key-status .invalid { color: #ff4444; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔷 AEGENTIX DASHBOARD</h1>
        <div class="sub">Cyber-Federated AI Agent</div>
    </div>
    <div class="grid">
        <div class="card"><div class="label">Status</div><div class="value online">● ONLINE</div></div>
        <div class="card"><div class="label">Agent</div><div class="value" style="font-size:16px;">cybercore_trader_pro</div></div>
        <div class="card"><div class="label">Wallet</div><div class="value" style="font-size:14px;">2a9ee21d...</div></div>
        <div class="card"><div class="label">API Key</div><div class="value" style="font-size:14px;color:#ffaa00;">CHECKING...</div></div>
    </div>
    <div class="key-status">
        <h3>🔑 API Key Status</h3>
        <p id="key-status-text">Testing connection...</p>
    </div>
    <script>
        async function checkKey() {
            try {
                const response = await fetch('https://www.moltbook.com/api/v1/agents/me', {
                    headers: {'Authorization': 'Bearer moltbook_sk_0l35cZZNYtlaKkL9lq4EDzc0fjiLter1'}
                });
                if (response.status === 200) {
                    document.getElementById('key-status-text').innerHTML = '<span class="valid">✅ VALID - Agent is online</span>';
                } else {
                    document.getElementById('key-status-text').innerHTML = `<span class="invalid">❌ INVALID - Status: ${response.status}</span>`;
                }
            } catch(e) {
                document.getElementById('key-status-text').innerHTML = '<span class="invalid">❌ Connection failed - Check internet</span>';
            }
        }
        checkKey();
    </script>
</body>
</html>
