name: Python Package using Conda

on:
  push:
    paths:
      - 'environment.yml'
      - '**/*.py'
      - '.github/workflows/python-package-conda.yml'
  pull_request:
    paths:
      - 'environment.yml'
      - '**/*.py'
      - '.github/workflows/python-package-conda.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Python project inputs
        id: detect
        shell: bash
        run: |
          if [[ -f environment.yml ]]; then
            echo "has_environment=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_environment=false" >> "$GITHUB_OUTPUT"
          fi
          if find . -type f -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.10
        if: steps.detect.outputs.has_environment == 'true' || steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Add Conda to system path
        if: steps.detect.outputs.has_environment == 'true'
        run: echo "$CONDA/bin" >> "$GITHUB_PATH"

      - name: Install Conda dependencies
        if: steps.detect.outputs.has_environment == 'true'
        run: conda env update --file environment.yml --name base

      - name: Lint Python
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test Python
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install pytest
          pytest

      - name: No Python project detected
        if: steps.detect.outputs.has_environment != 'true' && steps.detect.outputs.has_python != 'true'
        run: echo 'No environment.yml or Python source files detected; nothing to validate.'
