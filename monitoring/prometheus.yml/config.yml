global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aegentix-production
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'aegentix-agents'
    static_configs:
      - targets:
          - 'aegentix-agent-monitoring:8080'
          - 'aegentix-agent-incident-response:8080'
          - 'aegentix-agent-autoscaling:8080'
          - 'aegentix-agent-healing:8080'
          - 'aegentix-agent-deployment:8080'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
