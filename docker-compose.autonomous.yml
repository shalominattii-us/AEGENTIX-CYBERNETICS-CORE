services:
  # --- Aegentix Autonomous Agents ---
  agent-monitoring:
    build:
      context: ./agents/infrastructure
      dockerfile: Dockerfile.monitoring
    container_name: aegentix-agent-monitoring
    environment:
      AGENT_ROLE: monitoring
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - aegentix-net
    restart: unless-stopped

  agent-incident-response:
    build:
      context: ./agents/infrastructure
      dockerfile: Dockerfile.incident
    container_name: aegentix-agent-incident-response
    environment:
      AGENT_ROLE: incident-response
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - aegentix-net
    restart: unless-stopped

  agent-autoscaling:
    build:
      context: ./agents/infrastructure
      dockerfile: Dockerfile.autoscaling
    container_name: aegentix-agent-autoscaling
    environment:
      AGENT_ROLE: autoscaling
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - aegentix-net
    restart: unless-stopped

  agent-healing:
    build:
      context: ./agents/infrastructure
      dockerfile: Dockerfile.healing
    container_name: aegentix-agent-healing
    environment:
      AGENT_ROLE: healing
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - aegentix-net
    restart: unless-stopped

  agent-deployment:
    build:
      context: ./agents/infrastructure
      dockerfile: Dockerfile.deployment
    container_name: aegentix-agent-deployment
    environment:
      AGENT_ROLE: deployment
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - aegentix-net
    restart: unless-stopped

  # --- Monitoring & Observability Infrastructure ---
  prometheus:
    image: prom/prometheus:latest
    container_name: aegentix-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml/config.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - aegentix-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aegentix-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana-dashboards.yml/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/grafana-dashboard-aegentix-agents.json:/etc/grafana/provisioning/dashboards/aegentix/aegentix-agents-fleet.json
    depends_on:
      - prometheus
    networks:
      - aegentix-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: aegentix-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml/config.yml:/etc/alertmanager/config.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    networks:
      - aegentix-net
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: aegentix-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - aegentix-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: aegentix-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - aegentix-net
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.0
    container_name: aegentix-filebeat
    user: root
    volumes:
      - ./monitoring/filebeat.yml/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: filebeat -e --strict.perms=false
    networks:
      - aegentix-net
    depends_on:
      - elasticsearch
    restart: unless-stopped

networks:
  aegentix-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  elasticsearch-data:
