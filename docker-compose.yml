services:

  aegentix-runtime:
    build:
      context: ./services/runtime
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - aegentix-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  aegentix-gaia:
    build:
      context: ./services/gaia
    ports:
      - "8090:8090"
    restart: unless-stopped
