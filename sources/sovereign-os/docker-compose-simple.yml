version: '3.8'

networks:
  aegentis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  kernel-data:
    driver: local
  treasury-data:
    driver: local
  vector-data:
    driver: local
  worldmonitor-data:
    driver: local
  cybercore-logs:
    driver: local
  nats-data:
    driver: local
  cybercore-secrets-data:
    external: true
  cybercore-certs-data:
    external: true

services:

# ===========================================================
# HERMES MESSAGE BUS (NATS + JetStream)
# ===========================================================
  nats:
    image: nats:2.10-alpine
    container_name: aegentis-nats
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    command:
      - "-js"
      - "-m"
      - "8222"
    environment:
      - NATS_SERVER_NAME=aegentis-nats
      - NATS_CLUSTER_NAME=aegentis-cluster
      - NATS_ROUTES=nats-route://ruser:rpass@aegentis-nats:6222
      - NATS_JETSTREAM=1
      - NATS_STORE_DIR=/data/jetstream
    volumes:
      - nats-data:/data
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      aegentis.division: "HERMES"
      aegentis.role: "message-bus"
      aegentis.version: "2.10"

# ===========================================================
# CYBERCORE - Zero-Storage Deterministic Key Vault
# ===========================================================
  cybercore:
    build:
      context: ../../../AEGENTIX-CYBERNETICS-CORE
      dockerfile: Dockerfile.cybercore
      target: runtime
    container_name: aegentix-cybercore
    ports:
      - "50051:50051"
      - "9090:9090"
    volumes:
      - cybercore-secrets-data:/app/secrets:ro
      - cybercore-logs:/app/logs
      - cybercore-certs-data:/app/certs:ro
    environment:
      - CYBERCORE_MASTER_SEED_FILE=/app/secrets/master_seed
      - CYBERCORE_ENTROPY_PROVIDER=Argon2id
      - CYBERCORE_LOG_LEVEL=INFO
      - CYBERCORE_GRPC_PORT=50051
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - NATS_URL=nats://aegentis-nats:4222
      - CYBERCORE_WITH_HERMES=true
      - CYBERCORE_METRICS_PORT=9090
      - CYBERCORE_TLS_ENABLED=true
      - CYBERCORE_CERT_DIR=/app/certs
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      nats:
        condition: service_healthy
    labels:
      aegentis.division: "CYBERCORE"
      aegentis.role: "signing-oracle"
      aegentis.version: "1.0.0"

# ===========================================================
# AEGENTIS KERNEL - Event Bus (WorldMonitor)
# ===========================================================
  kernel-event-bus:
    build:
      context: ./KERNEL/event-bus
      dockerfile: Dockerfile
    container_name: aegentis-kernel
    ports:
      - "8080:8080"
    volumes:
      - kernel-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8080
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 30s
    labels:
      aegentis.division: "KERNEL"
      aegentis.role: "event-bus"
      aegentis.version: "1.0.0"
    depends_on:
      cybercore:
        condition: service_started

# KERNEL: Identity OS
  kernel-identity:
    build:
      context: ./KERNEL/identity-os
      dockerfile: Dockerfile
    container_name: aegentis-identity
    ports:
      - "8090:8090"
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080/intent
      - PORT=8090
      - SOVEREIGN_JWT_SECRET=${SOVEREIGN_JWT_SECRET:-aegentix-genesis-key}
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "KERNEL"
      aegentis.role: "identity-os"

# KERNEL: Agent Runtime (Jarvis)
  kernel-agent-runtime:
    build:
      context: ./KERNEL/agent-runtime
      dockerfile: Dockerfile
    container_name: aegentis-jarvis
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080/intent
      - JARVIS_LOOP_INTERVAL=10
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "KERNEL"
      aegentis.role: "agent-runtime"

# ===========================================================
# AEGENTIS TREASURY
# ===========================================================
  treasury:
    build:
      context: ./TREASURY
      dockerfile: Dockerfile
    container_name: aegentis-treasury
    ports:
      - "8081:8081"
    volumes:
      - treasury-data:/app/data
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080/intent
      - PORT=8081
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
      - ETH_RPC_URL=https://eth.llamarpc.com
      - BASE_RPC_URL=https://mainnet.base.org
      - ARBITRUM_RPC_URL=https://arb1.arbitrum.io/rpc
      - OPTIMISM_RPC_URL=https://mainnet.optimism.io
      - POLYGON_RPC_URL=https://polygon-rpc.com
      - XRPL_RPC_URL=https://xrplcluster.com
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - COSMOS_RPC_URL=https://cosmos-rpc.quickapi.com:443
      - STACKS_RPC_URL=https://stacks-node-api.mainnet.stacks.co
      - EVM_TREASURY_ADDRESS=0x71C865d4fC35E2a188B67B7A98AcB921098A1904
      - XRPL_TREASURY_ADDRESS=rZamanXRPLMainnetVaultAddr9948271
      - SOLANA_TREASURY_ADDRESS=SolanaMinimalTreasuryVault111111111111111111
      - COSMOS_TREASURY_ADDRESS=cosmos1aegentixminimaltreasuryvault99999
      - BITCOIN_L2_TREASURY_ADDRESS=bc1qaegentixminimalnodebtc2026vault999
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "TREASURY"
      aegentis.version: "1.0.0"

  treasury-agent:
    build:
      context: ./TREASURY/autonomous-agents
      dockerfile: Dockerfile
    container_name: aegentis-treasury-agent
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080/intent
      - TREASURY_LOOP_INTERVAL=15
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
      - ETH_RPC_URL=https://eth.llamarpc.com
      - BASE_RPC_URL=https://mainnet.base.org
      - ARBITRUM_RPC_URL=https://arb1.arbitrum.io/rpc
      - OPTIMISM_RPC_URL=https://mainnet.optimism.io
      - POLYGON_RPC_URL=https://polygon-rpc.com
      - XRPL_RPC_URL=https://xrplcluster.com
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - COSMOS_RPC_URL=https://cosmos-rpc.quickapi.com:443
      - STACKS_RPC_URL=https://stacks-node-api.mainnet.stacks.co
      - EVM_TREASURY_ADDRESS=0x71C865d4fC35E2a188B67B7A98AcB921098A1904
      - XRPL_TREASURY_ADDRESS=rZamanXRPLMainnetVaultAddr9948271
      - SOLANA_TREASURY_ADDRESS=SolanaMinimalTreasuryVault111111111111111111
      - COSMOS_TREASURY_ADDRESS=cosmos1aegentixminimaltreasuryvault99999
      - BITCOIN_L2_TREASURY_ADDRESS=bc1qaegentixminimalnodebtc2026vault999
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "TREASURY"
      aegentis.role: "autonomous-agent"

# ===========================================================
# AEGENTIS AI
# ==========================================================
  ai-runtime:
    build:
      context: ./AI/multi-llm-runtime
      dockerfile: Dockerfile
    container_name: aegentis-ai
    ports:
      - "8082:8082"
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080/intent
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - PORT=8082
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "AI"

# ===========================================================
# AEGENTIS XR - AEGENTIS-X Quest Backend
# ==========================================================
  xr-quest-backend:
    build:
      context: ./XR/quest
      dockerfile: Dockerfile
    container_name: aegentis-x
    ports:
      - "7778:7778"
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080/intent
      - QUEST_BACKEND_PORT=7778
      - SOVEREIGN_JWT_SECRET=${SOVEREIGN_JWT_SECRET:-aegentix-genesis-key}
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "XR"
      aegentis.role: "aegentis-x"

  # Legacy VR backend - uses separate repo context
  aegentis-vr:
    build:
      context: ../../../aegentis-vr-backend
      dockerfile: Dockerfile
    container_name: aegentis-vr
    ports:
      - "7777:7777"
    environment:
      - VR_PORT=7777
      - SOVEREIGN_JWT_SECRET=${SOVEREIGN_JWT_SECRET:-aegentix-genesis-key}
      - WORLDMONITOR_URL=http://kernel-event-bus:8080
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "XR"
      aegentis.role: "vr-backend"

# ===========================================================
# AEGENTIS SECURITY
# ==========================================================
  security-threat-monitor:
    build:
      context: ./SECURITY/threat-intelligence
      dockerfile: Dockerfile
    container_name: aegentis-security
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080/intent
      - THREAT_LOOP_INTERVAL=5
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "SECURITY"

  # SECURITY: Orbital Observer (Monitoring Dashboard)
  orbital-observer:
    build:
      context: ./SECURITY/monitoring
      dockerfile: Dockerfile
    container_name: aegentis-observer
    ports:
      - "9000:9000"
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080
      - PORT=9000
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "SECURITY"
      aegentis.role: "orbital-observer"

# ===========================================================
# AEGENTIS DATA
# ==========================================================
  data-vector-memory:
    build:
      context: ./DATA/vector-memory
      dockerfile: Dockerfile
    container_name: aegentis-data
    ports:
      - "8083:8083"
    volumes:
      - vector-data:/data/aegentis
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080/intent
      - AEGENTIS_VECTOR_DB=/data/aegentis/vectors.jsonl
      - PORT=8083
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "DATA"

# ===========================================================
# AEGENTIS CLOUD - Event Streaming
# ==========================================================
  cloud-event-stream:
    build:
      context: ./CLOUD/event-streaming
      dockerfile: Dockerfile
    container_name: aegentis-cloud
    ports:
      - "8084:8084"
    environment:
      - KERNEL_EVENT_BUS_URL=http://kernel-event-bus:8080/intent
      - PORT=8084
      - CYBERCORE_ORACLE_URL=http://aegentix-cybercore:50051
    networks:
      - aegentis-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      kernel-event-bus:
        condition: service_healthy
      cybercore:
        condition: service_started
    labels:
      aegentis.division: "CLOUD"