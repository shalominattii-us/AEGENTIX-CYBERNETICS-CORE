services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegentix
      POSTGRES_USER: aegentix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - government_ops_pgdata:/var/lib/postgresql/data
      - ./db/001_opportunity_spine.sql:/docker-entrypoint-initdb.d/001_opportunity_spine.sql:ro
      - ./db/002_capability_registry.sql:/docker-entrypoint-initdb.d/002_capability_registry.sql:ro
      - ./db/003_correspondence.sql:/docker-entrypoint-initdb.d/003_correspondence.sql:ro
      - ./db/004_engineering_program.sql:/docker-entrypoint-initdb.d/004_engineering_program.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegentix -d aegentix"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8099
      DATABASE_URL: postgresql://aegentix:${POSTGRES_PASSWORD:-change-me}@postgres:5432/aegentix
      CAPABILITY_INDEX_ENABLED: ${CAPABILITY_INDEX_ENABLED:-true}
      CAPABILITY_INDEX_INTERVAL_MS: ${CAPABILITY_INDEX_INTERVAL_MS:-900000}
      CAPABILITY_MAX_FILES: ${CAPABILITY_MAX_FILES:-500}
      CAPABILITY_ROOTS: /workspace
    ports:
      - "8099:8099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${AEGENTIX_WORKSPACE:-..}:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  outbox-worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://aegentix:${POSTGRES_PASSWORD:-change-me}@postgres:5432/aegentix
      CYBERCORE_EVENT_ENDPOINT: ${CYBERCORE_EVENT_ENDPOINT:-http://host.docker.internal:8000/api/bus}
      OUTBOX_INTERVAL_MS: 5000
      OUTBOX_MAX_BACKOFF_MS: 60000
      OUTBOX_BATCH_SIZE: 50
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  government_ops_pgdata:
