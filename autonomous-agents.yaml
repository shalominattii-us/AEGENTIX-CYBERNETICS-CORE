apiVersion: v1
kind: ServiceAccount
metadata:
  name: healing-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: healing-agent-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: healing-agent-binding
subjects:
- kind: ServiceAccount
  name: healing-agent
  namespace: default
roleRef:
  kind: ClusterRole
  name: healing-agent-role
  apiGroup: rbac.authorization.k8s.io
