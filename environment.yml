# Conda environment for the "Python Package using Conda" CI workflow.
#
# The cyberdaw package uses the standard library plus psutil (imported by
# cyberdaw/adapters.py), so psutil is listed here. Without it, pytest stops at
# collection with ModuleNotFoundError. The workflow installs flake8 and pytest
# separately in its own steps.
name: aegentix
channels:
  - conda-forge
dependencies:
  - python=3.10
  - psutil
